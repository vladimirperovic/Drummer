name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --prefix qa
      - run: npm --prefix qa test
      - run: python -m unittest discover -s qa -p "test_*.py" -v
      - run: npx --prefix qa playwright install --with-deps chromium
      - name: Start local server
        run: |
          python alati/server.py --port 8123 > /tmp/drummer-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8123/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/drummer-server.log
          exit 1
      - run: npm --prefix qa run test:browser
      - run: node alati/build-pages.mjs
