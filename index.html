<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drummer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='12' rx='13' ry='6' fill='%23ff6b6b'/%3E%3Cpath d='M3 12v9c0 3.3 5.8 6 13 6s13-2.7 13-6v-9' fill='%23c92a2a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><ellipse cx="16" cy="12" rx="13" ry="6" fill="#ff6b6b"/><path d="M3 12v9c0 3.3 5.8 6 13 6s13-2.7 13-6v-9" fill="#c92a2a"/><path d="M8 4l7 7M26 3l-8 8" stroke="#e9ecf1" stroke-width="2" stroke-linecap="round"/></svg>
    <b>Drummer</b><span class="sub">vježbanje bubnja</span>
  </div>
  <div id="midiStatus" class="status"><span class="dot"></span><span class="txt">MIDI…</span></div>
</header>

<div class="transport">
  <button id="playBtn" class="play" title="Start / stop (razmak)">▶ Start</button>
  <div class="tempo">
    <button class="tbtn" data-bpm="-5">−5</button>
    <button class="tbtn" data-bpm="-1">−1</button>
    <label class="bpm"><input id="bpm" type="number" min="30" max="260" aria-label="Tempo"><span>BPM</span></label>
    <button class="tbtn" data-bpm="1">+1</button>
    <button class="tbtn" data-bpm="5">+5</button>
    <input id="bpmSlider" type="range" min="30" max="260" aria-label="Tempo klizač">
  </div>
  <div class="opts">
    <label class="chip"><input type="checkbox" id="metro"> Metronom</label>
    <select id="clickSub" aria-label="Klik na"></select>
    <label class="chip"><input type="checkbox" id="countIn"> Odbrojavanje</label>
    <label class="chip"><input type="checkbox" id="loop"> Ponavljaj</label>
    <label class="chip"><input type="checkbox" id="playPattern"> Sviraj ritam</label>
    <label class="chip"><input type="checkbox" id="liveSound"> Zvuk mojih udaraca</label>
    <label class="chip rec"><input type="checkbox" id="record"> Snimaj u ritam</label>
  </div>
</div>

<main class="layout">
  <section class="main">
    <div class="card sheet">
      <div class="sheet-head">
        <h1 id="patternName"></h1>
        <span id="patternInfo" class="muted"></span>
        <span id="lastHit" class="lasthit"></span>
      </div>
      <div id="notation" class="paper"></div>
      <div id="countOverlay" class="countin" hidden></div>
      <div id="toast" class="toast" hidden></div>
    </div>

    <div class="viewtabs" role="tablist">
      <button data-view="kit" class="active">Bubanj</button>
      <button data-view="editor">Uredi ritam</button>
    </div>
    <div id="view-kit" class="card kitcard"></div>
    <div id="view-editor" class="card editor" hidden>
      <div class="ed-controls">
        <label>Naziv <input id="edName" type="text"></label>
        <label>Taktova <select id="edBars"></select></label>
        <label>Doba u taktu <select id="edBeats"></select></label>
        <label>Podjela
          <select id="edDiv"><option value="16">šesnaestine</option><option value="12">triole</option></select>
        </label>
        <label class="wide">Ruke (R/L po koraku)
          <input id="edSticking" type="text" placeholder="npr. RLRRLRLL, razmak = ništa" spellcheck="false">
        </label>
      </div>
      <div class="ed-actions">
        <button id="edClear">Očisti</button>
        <button id="edCopyBar">Kopiraj 1. takt u ostale</button>
        <span class="muted">Klik: normalno → akcenat → ghost → prazno. Desni klik briše. Shift-klik akcenat, Alt-klik ghost.</span>
      </div>
      <div id="grid" class="grid"></div>
    </div>
  </section>

  <aside class="side">
    <nav class="sidetabs" role="tablist">
      <button data-panel="library" class="active">Ritmovi</button>
      <button data-panel="stats">Rezultat</button>
      <button data-panel="settings">Podešavanja</button>
    </nav>

    <div id="panel-library" class="panel">
      <div class="row">
        <button id="saveBtn" class="primary">Sačuvaj</button>
        <button id="saveAsBtn">Sačuvaj kao novi</button>
        <button id="newBtn">Novi ritam</button>
      </div>
      <h3>Moji ritmovi</h3>
      <ul id="mine" class="list"></ul>
      <div class="row">
        <button id="exportBtn">Izvezi sve</button>
        <label class="btn">Uvezi fajl<input id="importFile" type="file" accept=".json,application/json" hidden></label>
      </div>
      <h3>Gotovi ritmovi</h3>
      <ul id="presets" class="list"></ul>
    </div>

    <div id="panel-stats" class="panel" hidden>
      <div class="bigscore"><span id="accuracy">–</span><small>tačnost</small></div>
      <div id="counts" class="counts"></div>
      <div class="loophead muted">Prolazi kroz ritam</div>
      <div id="loopBars" class="loopbars"></div>
      <table id="statTable" class="stats"></table>
      <p id="advice" class="advice"></p>
      <button id="resetStats">Obriši rezultat</button>
    </div>

    <div id="panel-settings" class="panel" hidden>
      <h3>MIDI</h3>
      <p id="midiInfo" class="muted"></p>
      <p class="muted">Zadnja primljena nota: <b id="lastNote">–</b></p>
      <table id="mapTable" class="maptable"></table>
      <div class="row"><button id="mapReset">Vrati TD-17 mapu</button></div>
      <label class="field">Pošalji ritam na MIDI izlaz (npr. EZdrummer)
        <select id="midiOut"><option value="">Ne, sviraj ovdje</option></select>
      </label>

      <h3>Tajming</h3>
      <label class="field">Strogost
        <select id="level">
          <option value="strogo">Strogo (±15 ms tačno)</option>
          <option value="normalno">Normalno (±25 ms tačno)</option>
          <option value="lagano">Lagano (±40 ms tačno)</option>
        </select>
      </label>
      <label class="field">Kalibracija kašnjenja (ms)<input id="calib" type="number" step="1"></label>
      <button id="calibBtn">Kalibriši: udaraj dobos uz klik</button>
      <p id="calibInfo" class="muted"></p>
      <label class="field">Tihi taktovi (klik nestane, ti držiš tempo)
        <select id="quiet">
          <option value="off">Ne</option>
          <option value="alt">Svaki drugi takt tih</option>
          <option value="2of4">Taktovi 3 i 4 od svaka 4 tihi</option>
        </select>
      </label>
      <label class="chip block"><input type="checkbox" id="trainerOn"> Trener tempa: +<input id="trainerStep" type="number" min="1" max="10" class="mini"> BPM kad prolaz ima 90% ili više</label>

      <h3>Zvuk</h3>
      <label class="field">Zvuk bubnja <select id="kitSelect"><option value="">Ugrađeni (sintetički)</option></select></label>
      <label class="field">Metronom <input type="range" id="volClick" min="0" max="1" step="0.05"></label>
      <label class="field">Ritam <input type="range" id="volPattern" min="0" max="1" step="0.05"></label>
      <label class="field">Moji udarci <input type="range" id="volLive" min="0" max="1" step="0.05"></label>
      <p id="latencyInfo" class="muted"></p>

      <h3>Tastatura</h3>
      <div id="keyHelp" class="keyhelp"></div>
    </div>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
